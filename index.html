<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#f2d9a8">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>合成大西瓜</title>
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;margin:0;padding:0;overflow:hidden;overscroll-behavior:none}
  body{
    background:radial-gradient(120% 85% at 50% 0%,#fffaf0 0%,#fbecc9 45%,#efd6a2 100%);
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;
    color:#6b4a22;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;touch-action:none;
  }
  #app{
    position:fixed;inset:0;display:flex;flex-direction:column;
    padding:calc(env(safe-area-inset-top,0px) + 6px) calc(env(safe-area-inset-right,0px) + 10px)
            calc(env(safe-area-inset-bottom,0px) + 6px) calc(env(safe-area-inset-left,0px) + 10px);
  }
  #hud{display:flex;align-items:center;gap:8px;flex:0 0 auto;padding:2px 0 8px}
  .panel{
    flex:1 1 auto;min-width:0;display:flex;align-items:baseline;gap:6px;
    background:rgba(255,255,255,.62);border:2px solid #fff;border-radius:14px;
    padding:4px 10px;box-shadow:0 3px 8px rgba(176,132,68,.18);
  }
  .k{font-size:12px;opacity:.6;letter-spacing:1px;white-space:nowrap}
  .v{font-size:20px;font-weight:800;font-variant-numeric:tabular-nums;line-height:1.15}
  .nextbox{
    flex:0 0 auto;width:48px;height:48px;border-radius:14px;background:rgba(255,255,255,.62);
    border:2px solid #fff;box-shadow:0 3px 8px rgba(176,132,68,.18);
    display:flex;align-items:center;justify-content:center;
  }
  #next{width:42px;height:42px;display:block}
  #snd{
    flex:0 0 auto;width:42px;height:42px;border-radius:13px;border:2px solid #fff;
    background:rgba(255,255,255,.62);box-shadow:0 3px 8px rgba(176,132,68,.18);
    font-size:17px;line-height:1;color:#6b4a22;cursor:pointer;font-family:inherit;
  }
  #snd.off{opacity:.4}
  #stage{position:relative;flex:1 1 auto;min-height:0;display:flex;align-items:center;justify-content:center}
  #cv{display:block;touch-action:none;border-radius:20px;
      box-shadow:0 16px 36px rgba(150,108,52,.30), 0 0 0 1px rgba(255,255,255,.5) inset}
  #over{
    position:absolute;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;
    background:rgba(70,45,15,.42);-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px);
    opacity:0;pointer-events:none;transition:opacity .22s ease;
  }
  #over.show{opacity:1;pointer-events:auto}
  .card{
    width:min(78vw,300px);background:#fffdf6;border-radius:22px;padding:22px 20px 20px;text-align:center;
    box-shadow:0 20px 50px rgba(80,50,10,.35);transform:translateY(12px) scale(.94);
    transition:transform .28s cubic-bezier(.2,1.4,.5,1);
  }
  #over.show .card{transform:none}
  .t1{font-size:14px;opacity:.55;letter-spacing:3px}
  .t2{font-size:46px;font-weight:900;margin:2px 0 0;color:#e2603c;font-variant-numeric:tabular-nums}
  .t3{font-size:14px;opacity:.75;margin:2px 0 18px}
  .t3 b{color:#e2603c}
  #again{
    width:100%;border:0;border-radius:14px;padding:13px;font-size:17px;font-weight:800;color:#fff;
    background:linear-gradient(180deg,#ffb03a,#f3822a);box-shadow:0 5px 0 #cf6a1c;
    cursor:pointer;font-family:inherit;
  }
  #again:active{transform:translateY(3px);box-shadow:0 2px 0 #cf6a1c}
</style>
</head>
<body>
<div id="app">
  <header id="hud">
    <div class="panel"><span class="k">分数</span><span class="v" id="score">0</span></div>
    <div class="nextbox"><canvas id="next"></canvas></div>
    <div class="panel"><span class="k">最高</span><span class="v" id="best">0</span></div>
    <button id="snd" aria-label="音效开关">♪</button>
  </header>
  <div id="stage"><canvas id="cv"></canvas></div>

  <div id="over">
    <div class="card">
      <div class="t1">游 戏 结 束</div>
      <div class="t2" id="fscore">0</div>
      <div class="t3">最高分 <b id="fbest">0</b></div>
      <button id="again">再来一局</button>
    </div>
  </div>
</div>

<script>
(function () {
  'use strict';

  /* ==================== 世界常量 ==================== */
  var TAU = Math.PI * 2;
  var W = 400, H = 760;                 // 世界坐标尺寸
  var WALL = 12;
  var TOP = 118;                        // 果盆上沿
  var LEFT = WALL, RIGHT = W - WALL, FLOOR = H - WALL;
  var DEATH_Y = TOP + 34;               // 死亡线
  var HOLD_Y = 62;                      // 待投放水果的圆心 Y
  var G = 2600;                         // 重力 (世界单位/秒²)
  var DT = 1 / 120;                     // 物理固定步长
  var ITER = 8;                         // 每步约束迭代次数
  var DAMP = 0.999;                     // 速度阻尼
  var MAXPEN = 1.0;                     // 单次约束最大修正的穿透量
  var MAXMOVE = 1.5;                    // 单个水果单次迭代最大位移
  var MAXV = 10;                        // 单个水果每子步最大位移（限速）
  var CEIL_Y = -40;                     // 顶部安全天花板（防飞出）
  var SPAWN = [30, 28, 20, 14, 8];      // 0~4 级出现权重

  /* ==================== 水果定义 ==================== */
  var FRUITS = [
    { r: 12,  c: '#e0334a', stem: 1 }, // 樱桃
    { r: 17,  c: '#ef3d55', stem: 1 }, // 草莓
    { r: 23,  c: '#9b59d0', stem: 1 }, // 葡萄
    { r: 30,  c: '#f2a03d', stem: 0 }, // 橘子
    { r: 38,  c: '#ef7a2e', stem: 1 }, // 柿子
    { r: 47,  c: '#e8402f', stem: 1 }, // 苹果
    { r: 57,  c: '#c9d63f', stem: 1 }, // 梨
    { r: 68,  c: '#f7a0b0', stem: 1 }, // 桃子
    { r: 79,  c: '#e5be33', stem: 1 }, // 菠萝
    { r: 89,  c: '#8ed16a', stem: 0 }, // 蜜瓜
    { r: 100, c: '#2f9e4f', stem: 0 }  // 西瓜
  ];

  function shade(hex, amt) {
    var n = parseInt(hex.slice(1), 16);
    var r = (n >> 16) & 255, g2 = (n >> 8) & 255, b = n & 255;
    if (amt > 0) { r += (255 - r) * amt; g2 += (255 - g2) * amt; b += (255 - b) * amt; }
    else { r *= 1 + amt; g2 *= 1 + amt; b *= 1 + amt; }
    return 'rgb(' + (r | 0) + ',' + (g2 | 0) + ',' + (b | 0) + ')';
  }
  for (var _i = 0; _i < FRUITS.length; _i++) {
    FRUITS[_i].c2 = shade(FRUITS[_i].c, 0.45);
    FRUITS[_i].c3 = shade(FRUITS[_i].c, -0.30);
  }

  /* ==================== 工具函数 ==================== */
  function clamp(v, a, b) { return v < a ? a : (v > b ? b : v); }
  function randLv() {
    var total = 0, i;
    for (i = 0; i < SPAWN.length; i++) total += SPAWN[i];
    var x = Math.random() * total;
    for (i = 0; i < SPAWN.length; i++) { x -= SPAWN[i]; if (x <= 0) return i; }
    return 0;
  }
  function roundRect(g, x, y, w, h, r) {
    r = Math.min(r, w / 2, h / 2);
    g.beginPath();
    g.moveTo(x + r, y);
    g.arcTo(x + w, y, x + w, y + h, r);
    g.arcTo(x + w, y + h, x, y + h, r);
    g.arcTo(x, y + h, x, y, r);
    g.arcTo(x, y, x + w, y, r);
    g.closePath();
  }

  /* ==================== 绘制水果 ==================== */
  function drawPattern(g, lv, r) {
    var i, a, px, py;
    if (lv === 1) { // 草莓籽
      var seeds = [[-.42,-.18],[.06,-.48],[.46,-.02],[-.2,.3],[.28,.42],[-.5,.28],[.5,.34]];
      g.fillStyle = 'rgba(255,246,190,.9)';
      for (i = 0; i < seeds.length; i++) {
        g.beginPath();
        g.ellipse(seeds[i][0] * r, seeds[i][1] * r, r * 0.055, r * 0.085, 0, 0, TAU);
        g.fill();
      }
    } else if (lv === 8) { // 菠萝网格
      g.strokeStyle = 'rgba(150,100,10,.32)';
      g.lineWidth = Math.max(1, r * 0.05);
      for (i = -3; i <= 3; i++) {
        g.beginPath(); g.moveTo(i * r * 0.34 - r * 0.8, -r); g.lineTo(i * r * 0.34 + r * 0.8, r); g.stroke();
        g.beginPath(); g.moveTo(i * r * 0.34 + r * 0.8, -r); g.lineTo(i * r * 0.34 - r * 0.8, r); g.stroke();
      }
    } else if (lv === 9) { // 蜜瓜纹
      g.strokeStyle = 'rgba(255,255,255,.55)';
      g.lineWidth = Math.max(1, r * 0.035);
      for (i = -2; i <= 2; i++) {
        g.beginPath();
        g.ellipse(i * r * 0.42, 0, r * 0.16, r * 1.04, 0, 0, TAU);
        g.stroke();
      }
    } else if (lv === 10) { // 西瓜条纹
      g.fillStyle = 'rgba(18,88,40,.62)';
      for (i = -2; i <= 2; i++) {
        g.beginPath();
        g.ellipse(i * r * 0.44, 0, r * 0.10, r * 1.06, 0, 0, TAU);
        g.fill();
      }
    } else if (lv === 3 || lv === 4) { // 橘皮质感
      g.fillStyle = 'rgba(140,70,10,.13)';
      for (i = 0; i < 16; i++) {
        a = i * 2.399;
        var rr = r * 0.82 * Math.sqrt((i % 7) / 7);
        g.beginPath();
        g.arc(Math.cos(a) * rr, Math.sin(a) * rr, r * 0.045, 0, TAU);
        g.fill();
      }
    }
  }

  function drawStem(g, lv, r) {
    if (!FRUITS[lv].stem) return;
    g.lineCap = 'round';
    g.strokeStyle = '#8a5f36';
    g.lineWidth = Math.max(1.2, r * 0.085);
    g.beginPath();
    g.moveTo(0, -r * 0.9);
    g.quadraticCurveTo(r * 0.1, -r * 1.14, r * 0.2, -r * 1.22);
    g.stroke();
    g.fillStyle = '#5cb04a';
    g.beginPath();
    g.ellipse(-r * 0.17, -r * 1.02, r * 0.22, r * 0.1, -0.55, 0, TAU);
    g.fill();
  }

  function drawFruit(g, lv, x, y, r, ang) {
    var F = FRUITS[lv];
    g.save();
    g.translate(x, y);
    g.rotate(ang || 0);
    var grd = g.createRadialGradient(-r * 0.3, -r * 0.36, r * 0.12, 0, 0, r * 1.04);
    grd.addColorStop(0, F.c2);
    grd.addColorStop(0.52, F.c);
    grd.addColorStop(1, F.c3);
    g.beginPath(); g.arc(0, 0, r, 0, TAU);
    g.fillStyle = grd; g.fill();
    g.save();
    g.beginPath(); g.arc(0, 0, r, 0, TAU); g.clip();
    drawPattern(g, lv, r);
    g.restore();
    g.lineWidth = Math.max(1, r * 0.05);
    g.strokeStyle = 'rgba(90,60,20,.16)';
    g.beginPath(); g.arc(0, 0, r - g.lineWidth * 0.5, 0, TAU); g.stroke();
    g.restore();

    g.save();
    g.translate(x, y);
    g.beginPath();
    g.ellipse(-r * 0.34, -r * 0.36, r * 0.26, r * 0.16, -0.6, 0, TAU);
    g.fillStyle = 'rgba(255,255,255,.5)'; g.fill();
    drawStem(g, lv, r);
    g.restore();
  }

  /* ==================== 画布 ==================== */
  var cv = document.getElementById('cv');
  var g = cv.getContext('2d');
  var nx = document.getElementById('next');
  var ng = nx.getContext('2d');
  var view = 1;

  function resize() {
    var stage = document.getElementById('stage');
    var aw = stage.clientWidth, ah = stage.clientHeight;
    if (aw <= 0 || ah <= 0) return;
    var s = Math.min(aw / W, ah / H);
    var cw = Math.floor(W * s), ch = Math.floor(H * s);
    var dpr = Math.min(window.devicePixelRatio || 1, 3);
    cv.style.width = cw + 'px';
    cv.style.height = ch + 'px';
    cv.width = Math.round(cw * dpr);
    cv.height = Math.round(ch * dpr);
    view = (cw * dpr) / W;
    drawNext();
  }

  function drawNext() {
    var dpr = Math.min(window.devicePixelRatio || 1, 3);
    var size = 42;
    nx.width = Math.round(size * dpr);
    nx.height = Math.round(size * dpr);
    ng.setTransform(dpr, 0, 0, dpr, 0, 0);
    ng.clearRect(0, 0, size, size);
    if (nextLv >= 0) drawFruit(ng, nextLv, size / 2, size / 2 + 3, 15, 0);
  }

  /* ==================== 物理 ==================== */
  var fruits = [];

  function makeFruit(lv, x, y, vx, vy, dropped) {
    var r = FRUITS[lv].r;
    return {
      x: x, y: y, px: x - vx, py: y - vy, r: r, lv: lv,
      im: 1 / (r * r), t: 0, ang: 0, pop: 0, cx: 0, cy: 0,
      dropped: !!dropped, dead: false
    };
  }

  function integrate(dt) {
    var gdt = G * dt * dt, i, f, vx, vy;
    for (i = 0; i < fruits.length; i++) {
      f = fruits[i];
      vx = (f.x - f.px) * DAMP;
      vy = (f.y - f.py) * DAMP;
      f.px = f.x; f.py = f.y;
      f.x += vx;
      f.y += vy + gdt;
      f.t += dt;
      f.ang += vx / f.r * 0.3;
      if (f.pop > 0) f.pop = Math.max(0, f.pop - dt * 5);
    }
  }

  function solve() {
    var n = fruits.length, it, i, j, a, b, dx, dy, d2, d, rr, pen, nxv, nyv, total, mag, k;
    if (!n) return;
    for (it = 0; it < ITER; it++) {
      // 先累加本轮的修正量，避免被多点挤压时叠加爆冲
      for (i = 0; i < n; i++) { fruits[i].cx = 0; fruits[i].cy = 0; }
      for (i = 0; i < n; i++) {
        a = fruits[i];
        for (j = i + 1; j < n; j++) {
          b = fruits[j];
          dx = b.x - a.x; dy = b.y - a.y;
          rr = a.r + b.r;
          d2 = dx * dx + dy * dy;
          if (d2 >= rr * rr) continue;
          d = Math.sqrt(d2);
          if (d < 1e-5) { dx = 1e-5; dy = 0; d = 1e-5; }
          nxv = dx / d; nyv = dy / d;
          pen = rr - d;
          if (pen > MAXPEN) pen = MAXPEN;
          total = a.im + b.im;
          a.cx -= nxv * pen * (a.im / total);
          a.cy -= nyv * pen * (a.im / total);
          b.cx += nxv * pen * (b.im / total);
          b.cy += nyv * pen * (b.im / total);
        }
      }
      for (i = 0; i < n; i++) {
        a = fruits[i];
        dx = a.cx; dy = a.cy;
        mag = Math.sqrt(dx * dx + dy * dy);
        if (mag > MAXMOVE) { k = MAXMOVE / mag; dx *= k; dy *= k; }
        a.x += dx; a.y += dy;
        if (a.x - a.r < LEFT) a.x = LEFT + a.r;
        else if (a.x + a.r > RIGHT) a.x = RIGHT - a.r;
        if (a.y + a.r > FLOOR) a.y = FLOOR - a.r;
        if (a.y < CEIL_Y) a.y = CEIL_Y;
      }
    }
    // 限速 + 抑制微小抖动
    for (i = 0; i < n; i++) {
      a = fruits[i];
      dx = a.x - a.px; dy = a.y - a.py;
      d2 = dx * dx + dy * dy;
      if (d2 < 0.0004) { a.px = a.x; a.py = a.y; }
      else if (d2 > MAXV * MAXV) {
        k = MAXV / Math.sqrt(d2);
        a.px = a.x - dx * k;
        a.py = a.y - dy * k;
      }
    }
  }

  function mergePass() {
    var touched = [], pairs = [], i, j, a, b, dx, dy, rr;
    for (i = 0; i < fruits.length; i++) {
      a = fruits[i];
      if (a.dead) continue;
      for (j = i + 1; j < fruits.length; j++) {
        b = fruits[j];
        if (b.dead || a.lv !== b.lv) continue;
        dx = b.x - a.x; dy = b.y - a.y;
        rr = a.r + b.r + 0.9;
        if (dx * dx + dy * dy <= rr * rr) { a.dead = true; b.dead = true; pairs.push(a, b); break; }
      }
    }
    if (!pairs.length) return;
    for (i = 0; i < pairs.length; i += 2) doMerge(pairs[i], pairs[i + 1]);
    var alive = [];
    for (i = 0; i < fruits.length; i++) if (!fruits[i].dead) alive.push(fruits[i]);
    fruits = alive;
  }

  function doMerge(a, b) {
    var lv = a.lv;
    var mt = a.r * a.r + b.r * b.r;
    var x = (a.x + b.x) / 2, y = (a.y + b.y) / 2;
    var vx = ((a.x - a.px) * a.r * a.r + (b.x - b.px) * b.r * b.r) / mt;
    var vy = ((a.y - a.py) * a.r * a.r + (b.y - b.py) * b.r * b.r) / mt;
    var nl = lv + 1;
    if (nl <= 10) {
      var nf = makeFruit(nl, x, y, vx, vy, true);
      nf.pop = 1;
      fruits.push(nf);
    }
    score += (nl <= 10) ? ((lv + 1) * (lv + 2) / 2) : 200;
    burst(x, y, FRUITS[lv].r, FRUITS[lv].c);
    blip(210 + lv * 58, 0.16, 0.055);
    if (score > best) { best = score; saveBest(); }
    updateHUD();
  }

  /* ==================== 粒子 ==================== */
  var parts = [];
  function burst(x, y, r, color) {
    var n = Math.min(16, 6 + Math.round(r / 5)), i, a, sp;
    for (i = 0; i < n; i++) {
      a = Math.random() * TAU;
      sp = 60 + Math.random() * 200;
      parts.push({
        x: x, y: y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 60,
        r: 1.5 + Math.random() * (r * 0.15),
        life: 0.4 + Math.random() * 0.35, t: 0, c: color
      });
    }
    if (parts.length > 320) parts.splice(0, parts.length - 320);
  }

  /* ==================== 音效（WebAudio，零依赖） ==================== */
  var actx = null, muted = false;
  function initAudio() {
    if (!actx) {
      try {
        var AC = window.AudioContext || window.webkitAudioContext;
        if (AC) actx = new AC();
      } catch (e) { actx = null; }
    }
    if (actx && actx.state === 'suspended') { try { actx.resume(); } catch (e) {} }
  }
  function blip(freq, dur, vol) {
    if (!actx || muted) return;
    try {
      var o = actx.createOscillator(), gn = actx.createGain();
      o.type = 'sine';
      o.frequency.setValueAtTime(freq, actx.currentTime);
      o.frequency.exponentialRampToValueAtTime(freq * 1.6, actx.currentTime + dur);
      gn.gain.setValueAtTime(0.0001, actx.currentTime);
      gn.gain.linearRampToValueAtTime(vol, actx.currentTime + 0.012);
      gn.gain.exponentialRampToValueAtTime(0.0001, actx.currentTime + dur);
      o.connect(gn); gn.connect(actx.destination);
      o.start(); o.stop(actx.currentTime + dur + 0.03);
    } catch (e) {}
  }

  /* ==================== 游戏状态 ==================== */
  var state = 'play';
  var score = 0, best = 0;
  var cur = null, nextLv = 0;
  var aimX = W / 2, heldY = HOLD_Y, heldT = 1, respawn = 0;
  var overTimer = 0;
  var dragging = false;

  var elScore = document.getElementById('score');
  var elBest = document.getElementById('best');
  var elOver = document.getElementById('over');
  var elFScore = document.getElementById('fscore');
  var elFBest = document.getElementById('fbest');

  function updateHUD() {
    elScore.textContent = score;
    elBest.textContent = best;
  }
  function saveBest() {
    try { localStorage.setItem('watermelon_best_v1', String(best)); } catch (e) {}
  }
  function loadBest() {
    try { best = parseInt(localStorage.getItem('watermelon_best_v1') || '0', 10) || 0; } catch (e) { best = 0; }
  }

  function reset() {
    fruits = [];
    parts = [];
    score = 0; overTimer = 0;
    cur = { lv: randLv() };
    nextLv = randLv();
    respawn = 0; heldT = 1; heldY = HOLD_Y;
    aimX = W / 2;
    state = 'play';
    elOver.classList.remove('show');
    updateHUD();
    drawNext();
  }

  function drop() {
    if (state !== 'play' || respawn > 0 || !cur) return;
    var lv = cur.lv, r = FRUITS[lv].r;
    var x = clamp(aimX, LEFT + r, RIGHT - r);
    fruits.push(makeFruit(lv, x, HOLD_Y, 0, 0, true));
    aimX = x;
    blip(150, 0.07, 0.03);
    cur = null;
    respawn = 0.32;
    heldT = 0;
  }

  function gameOver() {
    if (state !== 'play') return;
    state = 'over';
    if (score > best) { best = score; saveBest(); }
    updateHUD();
    elFScore.textContent = score;
    elFBest.textContent = best;
    elOver.classList.add('show');
    blip(180, 0.5, 0.06);
  }

  function checkOver(dt) {
    if (state !== 'play') return;
    var danger = false, i, f, dx, dy;
    for (i = 0; i < fruits.length; i++) {
      f = fruits[i];
      // t > 1.0 保证刚投下、正在穿越死亡线的水果不会误判
      if (!f.dropped || f.t < 1.0) continue;
      dx = f.x - f.px; dy = f.y - f.py;
      if (f.y - f.r < DEATH_Y && (dx * dx + dy * dy) < 0.25) { danger = true; break; }
    }
    if (danger) overTimer += dt;
    else overTimer = Math.max(0, overTimer - dt * 1.5);
    if (overTimer > 1.5) gameOver();
  }

  function updateHeld(dt) {
    if (state !== 'play') return;
    if (respawn > 0) {
      respawn -= dt;
      if (respawn <= 0) {
        cur = { lv: nextLv };
        nextLv = randLv();
        heldT = 0;
        drawNext();
      }
    } else {
      heldT += dt;
    }
    var t = Math.min(heldT / 0.22, 1);
    var e = 1 - Math.pow(1 - t, 3);
    heldY = -34 + (HOLD_Y + 34) * e;
  }

  function physicsStep(dt) {
    integrate(dt);
    solve();
    mergePass();
    checkOver(dt);
  }

  /* ==================== 渲染 ==================== */
  var now = 0;

  function drawBoard() {
    // 外壳
    var og = g.createLinearGradient(0, 0, 0, H);
    og.addColorStop(0, '#f7e0b6');
    og.addColorStop(0.5, '#eac78e');
    og.addColorStop(1, '#d9a869');
    roundRect(g, 0, 0, W, H, 22);
    g.fillStyle = og; g.fill();
    g.lineWidth = 2; g.strokeStyle = 'rgba(130,88,38,.35)'; g.stroke();

    // 盆内
    var ig = g.createLinearGradient(0, TOP, 0, FLOOR);
    ig.addColorStop(0, '#f6e6c6');
    ig.addColorStop(0.35, '#fffaf0');
    ig.addColorStop(1, '#fffdf8');
    roundRect(g, LEFT, TOP, RIGHT - LEFT, FLOOR - TOP, 14);
    g.fillStyle = ig; g.fill();
    g.lineWidth = 3; g.strokeStyle = 'rgba(150,108,58,.32)'; g.stroke();

    // 内壁高光
    g.save();
    roundRect(g, LEFT, TOP, RIGHT - LEFT, FLOOR - TOP, 14);
    g.clip();
    g.lineWidth = 6;
    g.strokeStyle = 'rgba(255,255,255,.55)';
    g.beginPath();
    g.moveTo(LEFT + 4, TOP + 8);
    g.lineTo(LEFT + 4, FLOOR - 20);
    g.stroke();
    g.restore();

    // 死亡线
    var warn = overTimer > 0;
    var pulse = warn ? (0.45 + 0.55 * Math.abs(Math.sin(now / 180))) : 1;
    g.save();
    g.setLineDash([10, 10]);
    g.lineWidth = warn ? 3 : 2;
    g.strokeStyle = warn
      ? 'rgba(226,60,60,' + (0.35 + 0.55 * pulse).toFixed(3) + ')'
      : 'rgba(180,120,60,.38)';
    g.beginPath();
    g.moveTo(LEFT + 6, DEATH_Y);
    g.lineTo(RIGHT - 6, DEATH_Y);
    g.stroke();
    g.restore();
  }

  function drawGuide() {
    if (!cur) return;
    var r = FRUITS[cur.lv].r;
    var x = clamp(aimX, LEFT + r, RIGHT - r);
    g.save();
    g.setLineDash([9, 11]);
    g.lineWidth = 2;
    g.strokeStyle = 'rgba(150,110,60,.30)';
    g.beginPath();
    g.moveTo(x, HOLD_Y + r + 4);
    g.lineTo(x, FLOOR - 4);
    g.stroke();
    g.restore();
  }

  function drawDanger() {
    if (overTimer <= 0) return;
    var a = Math.min(0.34, overTimer * 0.45) * (0.55 + 0.45 * Math.abs(Math.sin(now / 160)));
    g.save();
    var vg = g.createRadialGradient(W / 2, TOP + 200, 70, W / 2, TOP + 200, 420);
    vg.addColorStop(0, 'rgba(255,60,60,0)');
    vg.addColorStop(1, 'rgba(255,60,60,' + a.toFixed(3) + ')');
    roundRect(g, LEFT, TOP, RIGHT - LEFT, FLOOR - TOP, 14);
    g.fillStyle = vg;
    g.fill();
    g.restore();
  }

  function render() {
    g.setTransform(view, 0, 0, view, 0, 0);
    g.clearRect(0, 0, W, H);
    drawBoard();

    // 粒子（裁剪在果盆内，避免飘到盆沿上）
    if (parts.length) {
      g.save();
      roundRect(g, LEFT, TOP, RIGHT - LEFT, FLOOR - TOP, 14);
      g.clip();
      var i, p, k;
      for (i = 0; i < parts.length; i++) {
        p = parts[i];
        k = 1 - p.t / p.life;
        if (k <= 0) continue;
        g.globalAlpha = Math.max(0, k);
        g.fillStyle = p.c;
        g.beginPath();
        g.arc(p.x, p.y, p.r * (0.4 + 0.6 * k), 0, TAU);
        g.fill();
      }
      g.globalAlpha = 1;
      g.restore();
    }

    // 水果
    for (i = 0; i < fruits.length; i++) {
      var f = fruits[i];
      var s = 1 + 0.28 * f.pop;
      drawFruit(g, f.lv, f.x, f.y, f.r * s, f.ang);
      if (f.pop > 0) {
        g.save();
        g.globalAlpha = f.pop * 0.5;
        g.strokeStyle = '#fff';
        g.lineWidth = 3 * f.pop + 1;
        g.beginPath();
        g.arc(f.x, f.y, f.r * (1.05 + 0.5 * (1 - f.pop)), 0, TAU);
        g.stroke();
        g.restore();
      }
    }

    if (state === 'play') {
      drawGuide();
      if (cur) drawFruit(g, cur.lv, clamp(aimX, LEFT + FRUITS[cur.lv].r, RIGHT - FRUITS[cur.lv].r), heldY, FRUITS[cur.lv].r, 0);
    }

    drawDanger();
  }

  /* ==================== 主循环 ==================== */
  var last = 0, acc = 0;

  function frame(ts) {
    requestAnimationFrame(frame);
    if (!last) last = ts;
    now = ts;
    var dt = (ts - last) / 1000;
    last = ts;
    if (dt > 0.12) dt = 0.12;
    if (dt < 0) dt = 0;

    // 结束后冻结物理，避免结算时分数继续增长
    if (state === 'play') {
      updateHeld(dt);
      acc += dt;
      var steps = 0;
      while (acc >= DT && steps < 10) { physicsStep(DT); acc -= DT; steps++; }
      if (steps >= 10) acc = 0;
    }

    // 粒子
    var i, p;
    for (i = parts.length - 1; i >= 0; i--) {
      p = parts[i];
      p.t += dt;
      if (p.t >= p.life) { parts.splice(i, 1); continue; }
      p.vy += 1100 * dt;
      p.x += p.vx * dt;
      p.y += p.vy * dt;
    }

    render();
  }

  /* ==================== 输入 ==================== */
  function toWorldX(clientX) {
    var rect = cv.getBoundingClientRect();
    if (rect.width <= 0) return W / 2;
    return (clientX - rect.left) / rect.width * W;
  }

  function onDown(e) {
    initAudio();
    dragging = true;
    aimX = toWorldX(e.clientX);
    if (cv.setPointerCapture) { try { cv.setPointerCapture(e.pointerId); } catch (err) {} }
    e.preventDefault();
  }
  function onMove(e) {
    if (!dragging) return;
    aimX = toWorldX(e.clientX);
    e.preventDefault();
  }
  function onUp(e) {
    if (!dragging) return;
    dragging = false;
    if (e && e.clientX != null) aimX = toWorldX(e.clientX);
    drop();
    if (e) e.preventDefault();
  }

  if (window.PointerEvent) {
    cv.addEventListener('pointerdown', onDown, { passive: false });
    cv.addEventListener('pointermove', onMove, { passive: false });
    cv.addEventListener('pointerup', onUp, { passive: false });
    cv.addEventListener('pointercancel', function () { dragging = false; }, { passive: false });
  } else {
    cv.addEventListener('touchstart', function (e) { onDown(e.touches[0]); }, { passive: false });
    cv.addEventListener('touchmove', function (e) { onMove(e.touches[0]); }, { passive: false });
    cv.addEventListener('touchend', function (e) {
      var t = e.changedTouches[0];
      onUp(t);
    }, { passive: false });
    cv.addEventListener('mousedown', onDown, { passive: false });
    window.addEventListener('mousemove', function (e) { if (dragging) onMove(e); }, { passive: false });
    window.addEventListener('mouseup', onUp, { passive: false });
  }

  // 阻止页面滚动 / 缩放
  document.addEventListener('touchmove', function (e) {
    if (e.cancelable) e.preventDefault();
  }, { passive: false });
  document.addEventListener('gesturestart', function (e) { e.preventDefault(); });

  // 键盘（桌面端）
  window.addEventListener('keydown', function (e) {
    if (e.key === 'ArrowLeft') { aimX = clamp(aimX - 18, LEFT, RIGHT); e.preventDefault(); }
    else if (e.key === 'ArrowRight') { aimX = clamp(aimX + 18, LEFT, RIGHT); e.preventDefault(); }
    else if (e.key === ' ' || e.key === 'Enter') { drop(); e.preventDefault(); }
  });

  // 按钮
  document.getElementById('again').addEventListener('click', function () {
    initAudio();
    reset();
  });
  var sndBtn = document.getElementById('snd');
  sndBtn.addEventListener('click', function () {
    muted = !muted;
    sndBtn.classList.toggle('off', muted);
    sndBtn.textContent = muted ? '✕' : '♪';
    if (!muted) { initAudio(); blip(660, 0.09, 0.05); }
  });

  window.addEventListener('resize', resize);
  window.addEventListener('orientationchange', function () { setTimeout(resize, 250); });
  document.addEventListener('visibilitychange', function () { last = 0; acc = 0; });

  /* ==================== 启动 ==================== */
  loadBest();
  resize();
  reset();
  requestAnimationFrame(function () { resize(); requestAnimationFrame(frame); });
})();
</script>
</body>
</html>
